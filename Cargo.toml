[package]
name = "titan-integration-template"
version = "0.1.0"
edition = "2024"

[dependencies]
sha2 = "0.10"
# Phoenix's deployed EM_SBPF executable needs a newer replay runtime than the
# template's LiteSVM 0.6.1. Keep Titan's public trait/account types unchanged.
litesvm-modern = { package = "litesvm", version = "=0.16.0" }
modern-account = { package = "solana-account", version = "4.3" }
modern-address = { package = "solana-address", version = "~2.6.1" }
modern-clock = { package = "solana-clock", version = "~3.1.1" }
modern-compute-budget = { package = "solana-compute-budget", version = "4.2.1" }
modern-transaction = { package = "solana-transaction", version = "4.1.5" }
wincode = "0.5.5"
# Mixed Solana generations resolve five8 1.0 against five8_core 0.1.2;
# its std feature supplies the Error implementation required by solana-keypair.
five8_core = { version = "0.1.2", features = ["std"] }
arrayref = "0.3.6"
bytemuck = { version = "1.22", features = ["derive"] }
num_enum = "0.5.7"
enumflags2 = "0.6.4"
borsh = { version = "1.5.7", features = ["derive"] }
serde = "1.0.203"
serde_json = "1.0.117"
num-traits = "0.2"
uint = "0.9.5"
safe-transmute = "0.11.2"
solana-client = "2.2.1"
solana-rpc-client = "2.2.1"
solana-pubkey = "2.2.1"
solana-program = "2.2.1"
solana-program-pack = "2.2.1"
solana-program-option = "2.2.1"
solana-sysvar = "2.2.1"
solana-sdk-ids = "2.2.1"
solana-account = "2.2.1"
solana-account-info = "2.2.1"
solana-instruction = "2.2.1"
solana-compute-budget = "2.2.1"
solana-transaction = "2.2.1"
solana-hash = "2.2.1"
solana-sdk = "2.2.1"
solana-instructions-sysvar = "2.2.1"
bincode = "1.3.3"
dashmap = "6.0.1"
ahash = "0.8.11"
rstest = "0.18"
async-trait = "0.1.80"
thiserror = "1.0.61"
tokio = { version = "1.38.0", features = ["full"] }
log = "0.4.28"
env_logger = "0.11.3"
spl-token = { version = "7", features = ["no-entrypoint"] }
spl-token-2022 = { version = "^9", features = ["no-entrypoint"]}
spl-associated-token-account = "6"
litesvm =  { version = "^0.6.1"}
rand = "0.9.2"
assert_no_alloc = { version = "1.1.2", default-features = false }

[dev-dependencies]
flate2 = "1.1"

# Used only for the construction allocation check. Normal tests, including
# `quoting_speed`, run under true `--release`.
[profile.release-debug]
inherits = "release"
debug-assertions = true
overflow-checks = false
