[workspace]
members = ["programs/*", "test-programs/output-guard"]
default-members = ["programs/titan-v3-venue-template"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
